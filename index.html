
<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>統計學（一）｜教學網站</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:#102238;background:#f6f9fc}header{height:58px;padding:0 28px;display:flex;align-items:center;background:#fff;border-bottom:1px solid #cbdced}.brand{font-weight:700;font-size:18px;color:#102238}main{max-width:1120px;margin:auto;padding:40px 26px 56px}.eyebrow{color:#0563d8;font-weight:700;letter-spacing:.12em;font-size:14px}.hero h1{font-size:38px;margin:10px 0 8px}.hero p{font-size:18px;line-height:1.7;color:#536b84;margin:0 0 30px}.section-title{font-size:27px;margin:26px 0 16px}.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{display:block;background:#fff;border:1px solid #cbdced;border-radius:13px;padding:18px 19px;min-height:128px;color:#102238;transition:.15s ease}.card:hover{border-color:#0563d8;box-shadow:0 4px 14px rgba(16,34,56,.08);transform:translateY(-1px)}.week{color:#0563d8;font-size:13px;font-weight:700;letter-spacing:.08em}.title{font-size:21px;font-weight:700;line-height:1.4;margin-top:7px}.note{font-size:14px;color:#708196;margin-top:8px}.assessment{background:#f9fbfd}.footer{margin-top:30px;color:#718197;font-size:14px;border-top:1px solid #d9e3ed;padding-top:18px}@media(max-width:820px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){main{padding:30px 18px}.hero h1{font-size:32px}.weeks{grid-template-columns:1fr}.title{font-size:20px}}
</style>
</head>
<body>
<header><div class="brand">◈ 統計學（一）</div></header>
<main>
<section class="hero">
<div class="eyebrow">STATISTICS I</div>
<h1>統計學（一）教學網站</h1>
<p>從資料的基本概念、敘述統計與機率開始，循序進入隨機變數與離散機率分配。請依週次進入課程頁面查看主要教材與補充教材。</p>
</section>
<h2 class="section-title">課程週次</h2>
<div class="weeks" id="weeks"></div>
<div class="footer">本網站供「統計學（一）」課程教學與學習使用。</div>
</main>
<script>
const weeks={
"01":["統計學導論與資料基本概念","正式授課"],
"02":["敘述統計：資料整理、列表與圖示","正式授課"],
"03":["集中趨勢量數（一）：算術平均數","正式授課"],
"04":["集中趨勢量數（二）：幾何平均數、中位數與其他集中趨勢量數","正式授課"],
"05":["分散情形量數","正式授課"],
"06":["機率基礎與集合概念","正式授課"],
"07":["事件機率與機率運算","正式授課"],
"08":["階段評量與學習檢核","評量週"],
"09":["期中評量","評量週"],
"10":["貝氏定理、決策樹與計數法","正式授課"],
"11":["隨機變數與機率分配","正式授課"],
"12":["累積分配、聯合機率與期望值","正式授課"],
"13":["柏努利分配與二項分配","正式授課"],
"14":["二項分配的應用","正式授課"],
"15":["超幾何分配","正式授課"],
"16":["課程統整與學習評量","統整／評量週"],
"17":["期末評量","評量週"],
"18":["彈性學習與課程反思","彈性／反思週"]
};
const box=document.getElementById('weeks');
Object.entries(weeks).forEach(([w,d])=>{
 const a=document.createElement('a');
 a.href=`week.html?w=${w}`;
 a.className='card'+(d[1]!=="正式授課"?' assessment':'');
 a.innerHTML=`<div class="week">WEEK ${w}</div><div class="title">${d[0]}</div><div class="note">${d[1]} →</div>`;
 box.appendChild(a);
});
</script>
</body>
</html>
