<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>統計學（一）</title><style>
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft JhengHei",sans-serif;color:#102238;background:#f6f9fc}header{height:54px;padding:0 26px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #cbdced}a{color:#0563d8;text-decoration:none}main{max-width:1080px;margin:auto;padding:38px 26px}.wk{color:#0563d8;letter-spacing:.08em}h1{font-size:44px;margin:10px 0 12px}.desc{font-size:18px;color:#4a6481;margin-bottom:30px}h2{font-size:27px}.resource{display:flex;justify-content:space-between;align-items:center;gap:18px;background:#fff;border:1px solid #cbdced;border-radius:12px;padding:15px 18px;margin:10px 0;min-height:76px}.kind{font-size:13px;color:#0563d8}.name{font-size:17px;font-weight:700;margin-top:4px}.empty{color:#8a97a8}.btn{background:#0563d8;color:#fff;padding:11px 18px;border-radius:9px}.btn.alt{background:#fff;color:#0563d8;border:1px solid #cbdced}nav{display:flex;justify-content:space-between;margin-top:28px}
</style></head><body><header><strong>◈ 統計學（一）</strong><a href="index.html">← 返回首頁</a></header>
<main><div class="wk" id="wk"></div><h1 id="ttl"></h1><p class="desc" id="desc"></p><h2>本週學習資源</h2><div id="res"></div><nav id="nav"></nav></main>
<script>
const info={
"01":["統計學導論與資料基本概念","統計學、母體與樣本、統計變數、資料類型與衡量尺度。"],"02":["敘述統計：資料整理、列表與圖示","次數分配、統計表、統計圖與資料閱讀。"],"03":["集中趨勢量數（一）：算術平均數","集中趨勢、算術平均數、原始與分組資料平均數。"],"04":["集中趨勢量數（二）","幾何平均數、中位數、分位數、眾數、截尾與加權平均數。"],"05":["分散情形量數","全距、四分位距、變異數、標準差與變異係數。"],"06":["機率基礎與集合概念","集合、樣本空間、事件與機率基本概念。"],"07":["事件機率與機率運算","加法規則、條件機率、乘法規則與獨立事件。"],"08":["階段評量與學習檢核","本週不安排新進度。"],"09":["期中評量","本週不安排新進度。"],"10":["貝氏定理、決策樹與計數法","貝氏定理、決策樹、排列與組合。"],"11":["隨機變數與機率分配","隨機變數與離散機率分配。"],"12":["累積分配、聯合機率與期望值","累積分配、聯合與邊際機率、期望值與變異數。"],"13":["柏努利分配與二項分配","柏努利與二項分配。"],"14":["二項分配的應用","二項機率、累積機率與題型辨識。"],"15":["超幾何分配","有限母體與不放回抽樣。"],"16":["課程統整與學習評量","本週不安排新進度。"],"17":["期末評量","本週不安排新進度。"],"18":["彈性學習與課程反思","課程回顧與學習反思。"]};
const w=new URLSearchParams(location.search).get("w")||"01";document.getElementById("wk").textContent="Week "+w;document.getElementById("ttl").textContent=info[w][0];document.getElementById("desc").textContent=info[w][1];
fetch("materials.json",{cache:"no-store"}).then(r=>r.json()).then(c=>{const d=c[w]||{},box=document.getElementById("res");[["main","主要教材"],["supplement1","補充教材一"],["supplement2","補充教材二"]].forEach(([k,l])=>{const f=d[k]||"",row=document.createElement("div");row.className="resource";let a='<span class="empty">尚無檔案</span>';if(f){const ppt=/\.pptx?$/i.test(f);a=`<a class="btn ${ppt?"":"alt"}" target="_blank" href="${ppt?"viewer.html?file="+encodeURIComponent(f):"materials/"+encodeURIComponent(f)}">${ppt?"播放投影片":"開啟教材"}</a>`}row.innerHTML=`<div><div class="kind">${l}</div><div class="name">${f||"尚無檔案"}</div></div>${a}`;box.appendChild(row)})});
const n=+w;document.getElementById("nav").innerHTML=`<span>${n>1?`<a href="week.html?w=${String(n-1).padStart(2,"0")}">← Week ${String(n-1).padStart(2,"0")}</a>`:""}</span><a href="index.html">課程首頁</a><span>${n<18?`<a href="week.html?w=${String(n+1).padStart(2,"0")}">Week ${String(n+1).padStart(2,"0")} →</a>`:""}</span>`;
</script></body></html>
